# Codeception Functional Test Suite Configuration
#
# Domain logic tests with framework boot but without HTTP layer.

actor: FunctionalTester
modules:
    enabled:
        - Asserts
        - Laravel:
            environment_file: .env.testing
            # First domain migration lands in F-02 (magic_links) — earlier than the
            # F-01 placeholder anticipated. Tables are now required for DB-backed tests.
            run_database_migrations: true
        - Db:
            dsn: 'pgsql:host=%DB_HOST%;dbname=%DB_DATABASE%'
            user: '%DB_USERNAME%'
            password: '%DB_PASSWORD%'
            cleanup: true
step_decorators: ~
