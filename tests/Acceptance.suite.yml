# Codeception Acceptance Test Suite Configuration
#
# User-facing acceptance scenarios. Laravel module dispatches HTTP requests
# without WebDriver (faster than Selenium for MVP). Db cleanup rolls back
# between tests.

actor: AcceptanceTester
modules:
    enabled:
        - Asserts
        - Laravel:
            environment_file: .env.testing
            # run_database_migrations: re-enable when first domain migration lands (F-03)
            run_database_migrations: false
        - Db:
            dsn: 'pgsql:host=%DB_HOST%;dbname=%DB_DATABASE%'
            user: '%DB_USERNAME%'
            password: '%DB_PASSWORD%'
            cleanup: true
step_decorators:
    - Codeception\Step\ConditionalAssertion
    - Codeception\Step\TryTo
    - Codeception\Step\Retry
