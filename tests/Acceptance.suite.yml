# Codeception Acceptance Test Suite Configuration
#
# User-facing acceptance scenarios. Laravel module dispatches HTTP requests
# without WebDriver (faster than Selenium for MVP). Db cleanup rolls back
# between tests.

actor: AcceptanceTester
modules:
    enabled:
        - Asserts
        - Laravel:
            environment_file: .env.testing
            # First domain migration lands in F-02 (magic_links).
            # cleanup: false → writes COMMIT, so a row created in one request is
            # visible to the next request (the magic-link flow spans two requests).
            # The transactional default isolated each request on its own connection,
            # breaking that. Tests clean their own tables in _after instead.
            run_database_migrations: true
            cleanup: false
step_decorators:
    - Codeception\Step\ConditionalAssertion
    - Codeception\Step\TryTo
    - Codeception\Step\Retry
