name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  phpstan:
    name: PHPStan (level 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, bcmath, intl, zip, gd, exif
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Build Codeception actor traits
        run: vendor/bin/codecept build

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  codecept:
    name: Codeception (3 suites)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: podworko_user
          POSTGRES_PASSWORD: podworko_123
          POSTGRES_DB: podworko_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U podworko_user -d podworko_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, bcmath, intl, zip, gd, exif
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Override DB_HOST for CI Postgres service (localhost vs docker `db`)
        run: sed -i 's/^DB_HOST=.*/DB_HOST=localhost/' .env.testing

      - name: Run Codeception
        run: vendor/bin/codecept run
