; Production PHP config — applied as zz-production.ini so it overrides earlier .ini files alphabetically.

; OPcache for Laravel production (Sebastian Bergmann + Laravel docs baseline)
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1

; Memory + upload limits — upload_max_filesize=25M matches nginx client_max_body_size + FR-013 receipt-image scope
memory_limit=256M
post_max_size=32M
upload_max_filesize=25M
max_execution_time=60

; Security
expose_php=0
